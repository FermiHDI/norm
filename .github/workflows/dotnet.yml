name: .NET

# Every workflow in the FermiHDI repositories runs on demand only: no push,
# pull-request or merge trigger. Start a run from the Actions tab or with
# `gh workflow run <file>`.
on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./src/dotnet

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        submodules: recursive
    
    - name: Setup Python
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
      with:
        python-version: 3.x
    - name: Build NORM
      run: ./waf
      working-directory: .
        
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore /property:Configuration=Release
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release --logger trx --results-directory TestResults
    - name: Upload test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dotnet-results
        path: ./src/dotnet/TestResults
      if: ${{ always() }}
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
      with:
        files: ./src/dotnet/TestResults/*.trx
      if: ${{ always() }}
